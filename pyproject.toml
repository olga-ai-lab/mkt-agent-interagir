[project]
name = "mkt-agent-livo"
version = "1.0.0"
description = "Marketing Livonius/Livo Agent — RSS/arquivo/pauta → curador/redator/revisor/designer → post via Edge Function"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "OlgaAI" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    # Tetos de major: sem eles um rebuild do Railway sobe sozinho para o proximo
    # major e quebra em producao sem nenhuma mudanca de codigo. Foi exatamente o
    # que aconteceu quando anthropic 1.0.0 saiu e removeu temperature/top_p/top_k
    # da assinatura de messages.create().
    "anthropic>=1.0,<2",
    "openai>=1.40,<2",
    "langfuse>=4.0,<5",
    "supabase>=2.5,<3",
    "trafilatura>=1.10",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
